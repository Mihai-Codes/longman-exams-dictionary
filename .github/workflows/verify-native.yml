name: verify-native

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Runs ONLY when explicitly enabled: needs a self-hosted runner on the Mac
# that has the Glaze desktop app (the CLI and SDK exist nowhere else).
# Enable: install a GitHub self-hosted runner on that Mac, then set repo
# variable MAC_RUNNER=true. Labels match any Apple Silicon Mac runner;
# no runner names are hardcoded. Until then jobs skip cleanly and hosted
# CI remains the required check.
jobs:
  verify-native:
    if: vars.MAC_RUNNER == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      # The Glaze SDK lives beside the desktop app, never in the repo.
      # Link it where glaze.ts looks (two levels above the checkout),
      # exactly mirroring the local layout.
      - run: ln -sfn /Users/mihai/Glaze/.sdk "$(dirname $(dirname $GITHUB_WORKSPACE))/.sdk"
      - run: npm ci
      - run: bash glaze-node.sh verify
