name: verify

on:
  push:
    branches: [main]
  pull_request:

# The Glaze CLI (build, lint, repackage) only exists inside the Glaze
# desktop app, so CI covers the portable steps: install + type-check.
# Full builds and store repackaging stay local (see README Setup).
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
