name: verify

on:
  push:
    branches: [main]
  pull_request:

# The Glaze CLI (build, lint, type-check) and the @glaze/* SDK it resolves
# only exist inside the Glaze desktop app, so neither runs here. CI covers
# what is portable: dependency install plus scripts/verify.mjs, which
# asserts corpus integrity, guide coverage, branding red lines, shipping
# assets, and dictionary input edge cases without the Glaze SDK. Full native
# builds and store repackaging stay local (see README Setup).
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/verify.mjs
      - run: ./node_modules/.bin/tsx --test scripts/*.test.ts
      - run: ./node_modules/.bin/tsc -p tsconfig.ci.json
      - run: node scripts/bundle-check.mjs
