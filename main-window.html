<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' file: glaze-core: http://localhost:* http://127.0.0.1:* http://0.0.0.0:*; style-src 'self' 'unsafe-inline' file: glaze-core: http://localhost:* http://127.0.0.1:* http://0.0.0.0:*; img-src 'self' data: blob: file: local: ipc: glaze-core: https: http://localhost:* http://127.0.0.1:* http://0.0.0.0:*; font-src 'self' data: file: glaze-core:; connect-src 'self' file: local: ipc: glaze: glaze-core: https: http://localhost:* http://127.0.0.1:* http://0.0.0.0:* ws://localhost:* ws://127.0.0.1:* ws://0.0.0.0:*; media-src 'self' data: blob: file: local: ipc: https:; worker-src 'self' blob:; frame-src 'self' blob: data:"
    />
    <title>App</title>
    <style>
      /* Unified text scale — Quantic/Quantum design system pattern.
         These override Glaze's runtime-injected styles. */
      :root {
        --text-body: 14px;
        --text-body-leading: 1.55;
        --text-small: 12px;
        --text-small-leading: 1.4;
        --text-mini: 10px;
        --text-mini-leading: 1.3;
        --text-large: 16px;
        --text-large-leading: 1.5;
        --text-heading: 18px;
        --text-heading-leading: 1.35;
      }
      /* CD content reset — strip the 2006-era hardcoded Times New Roman /
         point sizes from raw entry & guide HTML so it inherits the unified
         scale. Scoped to the CD surfaces ONLY; the app UI (#root and its
         Glaze Text/Badge components) is untouched, so heading weight, size
         hierarchy, and italics render as designed. Font family and size are
         neutralized here — weight and style are left intact so bold/italic
         survive. */
      .led-entry-html,
      .led-guide-html,
      .led-entry-html *,
      .led-guide-html * {
        font-family: var(--font-sans) !important;
      }
      /* Strip ALL remaining CD inline hardcodes (font tags, style attrs) so
         they inherit the computed scale instead of the CD's fixed points. */
      .led-entry-html font,
      .led-guide-html font,
      .led-entry-html [style],
      .led-guide-html [style] {
        font-family: inherit !important;
        font-size: inherit !important;
      }
      /* Longman Pearson branding — must win over Glaze's injected
         stylesheets which load at runtime after our compiled CSS. */
      :root {
        --theme-accent: #364395 !important;
        --blue: #003366 !important;
        --selection: #364395 !important;
      }
      .dark {
        --theme-accent: #364395 !important;
        --selection: #364395 !important;
      }
    </style>
    <script>
      if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <style>
      :root {
        --background: hsl(0 0% 100% / 0.9);
      }
      .dark {
        --background: hsl(0 0% 0% / 0.4);
      }
      body {
        background: var(--background);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Preload is injected by the native layer via webPreferences.preload -->
    <script type="module" src="./renderer/main/index.tsx"></script>
  </body>
</html>
