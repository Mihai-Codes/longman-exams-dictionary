<html><head><title>Syllables</title><meta http-equiv="content-type" content="text/html; charset=utf-8"/><link rel="stylesheet" type="text/css" href="ldocehelp.css"/></head><h3 class="helphead">Syllables</h3>
<p class="help">The original CD-ROM could show syllable dots in the headword — for example <i>cir·cum·vent</i> — from a settings menu.</p>
<p class="help">This app has no syllable-dot toggle. Open the entry and click Audio to hear how the word is spoken. See <a class="helplink" href="pronunciation.htm">pronunciation</a> and <a class="helplink" href="settings.htm">settings</a>.</p>
