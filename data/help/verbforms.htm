<html><head><title>Verb forms</title><meta http-equiv="content-type" content="text/html; charset=utf-8"/><link rel="stylesheet" type="text/css" href="ldocehelp.css"/></head><h3 class="helphead">Verb forms</h3>
 <p class="help">Every verb entry in the <a class="helplink" href="introduction.htm">dictionary</a> shows its inflections — present, past, and past participle — in the Verb forms card on the entry page, for regular <i>and</i> irregular verbs. If a verb has different forms in American and British English they are labelled.</p>
