<html><head><title>Phrase bank</title><meta http-equiv="content-type" content="text/html; charset=utf-8"/><link rel="stylesheet" type="text/css" href="ldocehelp.css"/></head><h3 class="helphead">Phrase bank</h3>
<p class="help">Phrases sit on the entry, in the Phrases card. Open a word such as <i>magic</i> and you will see combinations like <i>magic circle</i>, <i>magic moment</i>, <i>magic word</i>.</p>
<p class="help">Both cards sit on the same page, so you can read the combinations and the sentences that use them in one pass. See <a class="helplink" href="examples.htm">examples</a>.</p>
