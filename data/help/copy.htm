<h3 class="helphead">Copy and Paste</h3>
<p class="help">The CD-ROM copied entry text through a tools-button menu. On the Mac the standard way applies everywhere in this app.</p>
<p class="help">Drag across any part of an entry to highlight it, then press &#8984;C to copy. Open a document in any other program and press &#8984;V to paste it in.</p>
