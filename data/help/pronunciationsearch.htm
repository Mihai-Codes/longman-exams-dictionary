<html><head><title>Pronunciation search</title><meta http-equiv="content-type" content="text/html; charset=utf-8"/><link rel="stylesheet" type="text/css" href="ldocehelp.css"/></head><h3 class="helphead">Pronunciation search</h3>
<p class="help">The original CD-ROM could find words by phonetic pattern — for example <i>*Is</i> listed words ending with the sound /Is/: abyss, avarice, actress.</p>
<p class="help">This app has no pronunciation search. Type a spelling in Dictionary, open the <a class="helplink" href="pronunciation.htm">entry</a>, and click Audio beside the headword to hear it.</p>
